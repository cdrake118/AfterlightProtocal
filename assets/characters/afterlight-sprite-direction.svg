<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Afterlight Protocol Sprite Direction Sheet</title>
  <desc id="desc">Preview sheet for runtime-generated investigator and anomaly sprites.</desc>
  <defs>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="visor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="0.48" stop-color="#91f0eb"/>
      <stop offset="1" stop-color="#10272c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17242c"/>
      <stop offset="1" stop-color="#090f14"/>
    </linearGradient>
    <symbol id="hunter" viewBox="-64 -64 128 128">
      <ellipse cx="-2" cy="18" rx="32" ry="12" fill="rgba(0,0,0,0.42)"/>
      <rect x="-37" y="-17" width="28" height="35" rx="9" fill="#132329" stroke="#6f8590" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="-36" y="-25" width="20" height="8" rx="4" fill="#071015"/>
      <rect x="-36" y="18" width="20" height="8" rx="4" fill="#071015"/>
      <rect class="suit" x="-24" y="-26" width="48" height="52" rx="16" fill="#dfefff" stroke="#071015" stroke-width="4"/>
      <rect x="-14" y="-22" width="24" height="8" rx="4" fill="#ffffff" opacity="0.16"/>
      <circle class="helmet" cx="-1" cy="0" r="26" fill="#dfefff" stroke="#071015" stroke-width="4"/>
      <rect x="5" y="-14" width="36" height="27" rx="9" fill="url(#visor)" stroke="#071015" stroke-opacity="0.78" stroke-width="2"/>
      <rect x="13" y="-9" width="18" height="3" fill="#ffffff" opacity="0.62"/>
      <circle class="lamp" cx="16" cy="-17" r="4" fill="#dff7ff"/>
      <path class="straps" d="M-12 -22 L-28 -34 M-11 22 L-28 34" stroke="#dff7ff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
      <rect x="27" y="-9" width="31" height="18" rx="6" fill="#e9fbff" stroke="#071015" stroke-width="2"/>
      <rect x="51" y="-3" width="12" height="6" fill="#f4b35d"/>
      <path d="M-18 2 C-12 20 10 23 22 7" fill="none" stroke="#dff7ff" stroke-opacity="0.42" stroke-width="2"/>
    </symbol>
    <symbol id="hunterDown" viewBox="-64 -64 128 128">
      <ellipse cx="0" cy="18" rx="34" ry="12" fill="rgba(0,0,0,0.42)"/>
      <g transform="rotate(86)">
        <rect x="-35" y="-16" width="26" height="34" rx="9" fill="#263039" stroke="#6f8590" stroke-opacity="0.35" stroke-width="2"/>
        <rect x="-25" y="-25" width="50" height="50" rx="16" fill="#39444d" stroke="#071015" stroke-width="4"/>
        <circle cx="-1" cy="0" r="25" fill="#66727c" stroke="#071015" stroke-width="4"/>
        <rect x="5" y="-13" width="34" height="26" rx="9" fill="#40505a" stroke="#071015" stroke-width="2"/>
        <rect x="27" y="-9" width="31" height="18" rx="6" fill="#2f3941" stroke="#071015" stroke-width="2"/>
        <rect x="51" y="-3" width="12" height="6" fill="#1e252b"/>
        <path d="M-12 -22 L-28 -33 M-12 22 L-28 33" stroke="#7d8b94" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
      </g>
    </symbol>
    <symbol id="anomaly" viewBox="-64 -64 128 128">
      <circle cx="0" cy="0" r="54" fill="#e76f8a" opacity="0.16" filter="url(#softGlow)"/>
      <polygon points="0,-38 13,-20 34,-24 24,-4 38,12 15,16 8,38 -8,18 -32,24 -20,2 -34,-15 -11,-17" fill="#e76f8a" stroke="#2a0914" stroke-width="4"/>
      <polygon points="-7,-20 17,-7 4,22 -20,5" fill="#ffd6df" opacity="0.82"/>
      <path d="M-32 0 L34 -3 M1 -34 L6 33" stroke="#ffeeF3" stroke-opacity="0.72" stroke-width="2" stroke-linecap="round"/>
      <g fill="#ffeeF3" opacity="0.7">
        <polygon points="0,-47 6,-41 0,-35 -6,-41"/>
        <polygon points="45,-7 51,-1 45,5 39,-1"/>
        <polygon points="15,42 21,48 15,54 9,48"/>
        <polygon points="-40,15 -34,21 -40,27 -46,21"/>
      </g>
    </symbol>
  </defs>
  <rect width="1120" height="720" fill="#05070a"/>
  <rect x="24" y="24" width="1072" height="672" rx="18" fill="#0b1117" stroke="#263641"/>
  <text x="56" y="76" fill="#f8fbfd" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="900">Afterlight Protocol Sprite Direction</text>
  <text x="56" y="108" fill="#90a3af" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800">Runtime sprite preview: original paranormal containment technicians and spectral anomaly.</text>

  <g font-family="Inter, Segoe UI, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(60 142)">
      <text x="0" y="0" fill="#d9e7ee" font-size="18" text-anchor="start">Investigators</text>
    </g>
    <g transform="translate(112 214)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#hunter" width="86" height="86" x="-43" y="-43" style="--suit:#dfefff"/>
      <text x="0" y="76" fill="#d9e7ee" font-size="13">Field White</text>
    </g>
    <g transform="translate(288 214)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#hunter" width="86" height="86" x="-43" y="-43" color="#7ae4d6"/>
      <circle cx="-1" cy="0" r="17" fill="#7ae4d6" opacity="0.38"/>
      <text x="0" y="76" fill="#d9e7ee" font-size="13">Tideglass</text>
    </g>
    <g transform="translate(464 214)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#hunter" width="86" height="86" x="-43" y="-43"/>
      <circle cx="-1" cy="0" r="17" fill="#f4b35d" opacity="0.42"/>
      <text x="0" y="76" fill="#d9e7ee" font-size="13">Emberline</text>
    </g>
    <g transform="translate(640 214)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#hunter" width="86" height="86" x="-43" y="-43"/>
      <circle cx="-1" cy="0" r="17" fill="#c7a8ff" opacity="0.42"/>
      <text x="0" y="76" fill="#d9e7ee" font-size="13">Violet Lab</text>
    </g>
    <g transform="translate(816 214)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#hunterDown" width="86" height="86" x="-43" y="-43" opacity="0.8"/>
      <text x="0" y="76" fill="#d9e7ee" font-size="13">Collapsed</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif" font-weight="800" text-anchor="middle">
    <text x="60" y="394" fill="#d9e7ee" font-size="18" text-anchor="start">Anomaly Pulse Frames</text>
    <g transform="translate(112 490)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#anomaly" width="92" height="92" x="-46" y="-46"/>
      <text x="0" y="76" fill="#d9e7ee" font-size="13">Frame 01</text>
    </g>
    <g transform="translate(288 490) rotate(12)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#anomaly" width="96" height="96" x="-48" y="-48"/>
    </g>
    <text x="288" y="566" fill="#d9e7ee" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Frame 02</text>
    <g transform="translate(464 490) rotate(24)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#anomaly" width="100" height="100" x="-50" y="-50"/>
    </g>
    <text x="464" y="566" fill="#d9e7ee" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Frame 03</text>
    <g transform="translate(640 490) rotate(36)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#anomaly" width="98" height="98" x="-49" y="-49"/>
    </g>
    <text x="640" y="566" fill="#d9e7ee" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Frame 04</text>
    <g transform="translate(816 490) rotate(48)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#anomaly" width="94" height="94" x="-47" y="-47"/>
    </g>
    <text x="816" y="566" fill="#d9e7ee" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Frame 05</text>
    <g transform="translate(992 490) rotate(60)">
      <rect x="-54" y="-54" width="108" height="108" rx="12" fill="url(#panel)" stroke="#263641"/>
      <use href="#anomaly" width="90" height="90" x="-45" y="-45"/>
    </g>
    <text x="992" y="566" fill="#d9e7ee" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Frame 06</text>
  </g>

  <text x="56" y="650" fill="#90a3af" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">Note: the live game currently renders equivalent cached canvas sprites at runtime, not from this SVG sheet. This sheet is a visible art-direction preview.</text>
</svg>
